[project]
name = "py-ts-code"
version = "0.1.0"
description = "Time Series Practice"
authors = [
    {name = "luis.ascencio@cimat.mx"}
]
license = {text = "GPL3"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib (==3.10.7)",
    "numpy (==2.3.4)",
    "pandas (==2.3.3)",
    "scikit-learn (==1.7.2)",
    "seaborn (==0.13.2)",
    "session-info (==1.0.1)",
    "sktime (==0.38.5)",
    "statsforecast (==2.0.2)",
    "statsmodels (==0.14.5)",
    "xlrd (>=2.0.2,<3.0.0)",
    "tqdm (>=4.67.3,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
